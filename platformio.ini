; platformio.ini — E-reader ESP32, Fase 1
;
; Entornos:
;   native           -> tests del núcleo (Unity) + CLI de paginación en el PC.
;   devkit_v1        -> ESP32 DevKit V1 (banco de pruebas), Arduino vía pioarduino.
;   s3_compile_check -> solo compila el núcleo para el S3 (garantía de portabilidad).
;
; pioarduino (fork comunitario) da Arduino-ESP32 3.x sobre ESP-IDF 5.x, que el
; platform oficial tardó en soportar. Versión fijada: 55.03.312-1
; (Arduino-ESP32 3.3.12 / ESP-IDF 5.5.5), verificada en la documentación oficial.

[platformio]
default_envs = native

[env]
build_flags = -Wall -Wextra

; ---------------------------------------------------------------------------
; Tests del núcleo y CLI en el PC.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_src_filter = +<cli_main.cpp>
build_flags =
    ${env.build_flags}
    -std=c++17
    -DEREADER_NATIVE
lib_compat_mode = off

; ---------------------------------------------------------------------------
; ESP32 DevKit V1 — aplicación de consola serie.
; ---------------------------------------------------------------------------
[env:devkit_v1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
build_flags =
    ${env.build_flags}
    -std=gnu++17

; ---------------------------------------------------------------------------
; ESP32-S3 (N16R8) — solo comprobación de compilación del núcleo.
; ---------------------------------------------------------------------------
[env:s3_compile_check]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
build_src_filter = +<main_s3_min.cpp>
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DBOARD_HAS_PSRAM
